<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f5;--surface:#fff;--ink:#14282d;--muted:#5d7278;--line:#d5e0e4;--accent:#0f7b6c;--accent-ink:#fff;--danger:#b3302f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1d;--surface:#16262a;--ink:#e6f0f2;--muted:#8fa7ad;--line:#27403f;--accent:#4cc7b2;--accent-ink:#0e1a1d;--danger:#f08583}}
:root[data-theme="dark"]{--bg:#0e1a1d;--surface:#16262a;--ink:#e6f0f2;--muted:#8fa7ad;--line:#27403f;--accent:#4cc7b2;--accent-ink:#0e1a1d;--danger:#f08583}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;font-weight:800;margin:0 0 16px;letter-spacing:-.01em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button,input{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:500}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.count{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--accent)}
.label{color:var(--muted);margin-top:4px}
.add{display:flex;gap:10px;margin-top:16px}
.add input{flex:1}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.dates{list-style:none;margin:0;padding:0}
.dates li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dates li:last-child{border-bottom:0}
.dates .k{color:var(--muted);width:2.2em;font-weight:700}
.dates .d{flex:1}
.x{border:0;background:none;color:var(--muted);padding:6px 8px}
.note{color:var(--muted);font-size:14px;margin:0}
.newc{display:flex;gap:8px;margin-top:6px}
.newc input{flex:1}
.link{border:0;background:none;color:var(--danger);padding:0;font-size:14px;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Class counter</h1>
  <div class="chips" id="chips"></div>

  <div id="view" class="hidden">
    <div class="card">
      <div class="count" id="count">0</div>
      <div class="label" id="label">classes held</div>
      <div class="add">
        <input type="date" id="date" aria-label="Class date">
        <button class="primary" id="add">Add class</button>
      </div>
    </div>
    <div class="card">
      <ul class="dates" id="dates"></ul>
      <p class="note" id="none">No classes added yet. Pick a date above and tap Add class.</p>
    </div>
    <button class="link" id="delc">Delete this course</button>
  </div>

  <div class="card" style="margin-top:14px">
    <strong>Add a course</strong>
    <div class="newc">
      <input type="text" id="cname" placeholder="e.g. Digital Techniques" aria-label="Course name">
      <button id="cadd">Add</button>
    </div>
  </div>
</main>
<div class="toast hidden" id="toast" role="status"></div>
<script>
(function(){
  var KEY="class-counter-v1",st={courses:[],active:null};
  try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.courses)st=p;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  var $=function(i){return document.getElementById(i)};
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function toast(m){var t=$("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.add("hidden")},1800)}
  function cur(){return st.courses.filter(function(c){return c.id===st.active})[0]}
  function fmt(d){var x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
  $("date").value=today();

  function render(){
    if(!cur()&&st.courses.length)st.active=st.courses[0].id;
    $("chips").innerHTML=st.courses.map(function(c){return '<button class="chip" data-id="'+c.id+'" aria-pressed="'+(c.id===st.active)+'">'+esc(c.name)+' · '+c.dates.length+'</button>'}).join("");
    var c=cur();$("view").classList.toggle("hidden",!c);
    if(!c)return;
    $("count").textContent=c.dates.length;
    $("label").textContent=(c.dates.length===1?"class":"classes")+" held in "+c.name;
    var sorted=c.dates.map(function(d,i){return{d:d,i:i}}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.i-b.i});
    $("dates").innerHTML=sorted.map(function(o,n){return '<li><span class="k">'+(n+1)+'</span><span class="d">'+fmt(o.d)+'</span><button class="x" data-i="'+o.i+'" aria-label="Remove '+fmt(o.d)+'">✕</button></li>'}).join("");
    $("none").classList.toggle("hidden",c.dates.length>0);
  }
  $("chips").onclick=function(e){var b=e.target.closest(".chip");if(b){st.active=b.getAttribute("data-id");save();render()}};
  $("cadd").onclick=function(){
    var n=$("cname").value.trim();if(!n){toast("Type a course name");return}
    var c={id:"c"+Date.now().toString(36),name:n,dates:[]};st.courses.push(c);st.active=c.id;$("cname").value="";save();render();
  };
  $("cname").onkeydown=function(e){if(e.key==="Enter")$("cadd").click()};
  $("add").onclick=function(){
    var c=cur(),d=$("date").value;if(!c)return;if(!d){toast("Pick a date first");return}
    if(c.dates.indexOf(d)>-1&&!confirm("A class is already added on this date. Add another one?"))return;
    c.dates.push(d);save();render();toast("Class "+c.dates.length+" added");
  };
  $("dates").onclick=function(e){
    var b=e.target.closest("button");if(!b)return;var c=cur();
    if(confirm("Remove this class?")){c.dates.splice(+b.getAttribute("data-i"),1);save();render()}
  };
  $("delc").onclick=function(){
    var c=cur();if(c&&confirm("Delete "+c.name+" and all its dates?")){st.courses=st.courses.filter(function(x){return x.id!==c.id});st.active=null;save();render()}
  };
  render();
})();
</script>
</body>
</html>
